name: 24/7 Auto Scraper

on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests curl_cffi

      - name: Run Scraper
        run: python -u cloud_scraper.py
