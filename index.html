<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dhaniwin Pro AI Predictor</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: 'Segoe UI', Arial, sans-serif; background-color: #0f172a; }
        #game-frame { width: 100%; height: 100%; border: none; }
        
        #floating-bubble {
            position: fixed; bottom: 30px; right: 20px; width: 55px; height: 55px; 
            background: linear-gradient(135deg, #eab308, #ca8a04);
            border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 26px;
            box-shadow: 0 0 20px rgba(234, 179, 8, 0.6); cursor: pointer; z-index: 999999; 
            transition: transform 0.2s, box-shadow 0.2s; border: 2px solid #fef08a;
            animation: pulse-glow 2s infinite;
        }
        #floating-bubble:active { transform: scale(0.9); }
        @keyframes pulse-glow {
            0% { box-shadow: 0 0 15px rgba(234, 179, 8, 0.4); }
            50% { box-shadow: 0 0 25px rgba(234, 179, 8, 0.8); }
            100% { box-shadow: 0 0 15px rgba(234, 179, 8, 0.4); }
        }

        #dw-predictor-widget {
            display: none; position: fixed; bottom: 30px; right: 20px; width: 200px;
            background: rgba(15, 23, 42, 0.95); border: 2px solid #eab308; border-radius: 16px;
            padding: 15px; color: white; z-index: 999999; box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            text-align: center; backdrop-filter: blur(8px); user-select: none;
        }
        
        .close-btn { position: absolute; top: 8px; right: 12px; color: #ef4444; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .close-btn:hover { color: #f87171; transform: scale(1.1); }
        
        .dw-title { font-size: 14px; font-weight: 900; color: #eab308; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
        .dw-period { font-size: 12px; color: #94a3b8; margin-bottom: 8px; font-weight: bold; background: rgba(255,255,255,0.05); padding: 4px; border-radius: 6px; }
        
        .result-container { background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 10px 5px; margin-bottom: 8px; }
        .dw-label { font-size: 11px; color: #cbd5e1; text-transform: uppercase; font-weight: bold; }
        
        .dw-pred { font-size: 28px; font-weight: 900; margin: 2px 0; letter-spacing: 2px; }
        .dw-big { color: #34d399; text-shadow: 0 0 15px rgba(52, 211, 153, 0.5); }
        .dw-small { color: #f472b6; text-shadow: 0 0 15px rgba(244, 114, 182, 0.5); }
        
        .dw-number-box { margin-top: 5px; border-top: 1px dashed rgba(255,255,255,0.1); padding-top: 8px; }
        .dw-number { font-size: 24px; font-weight: 900; color: #fbbf24; text-shadow: 0 0 15px rgba(251, 191, 36, 0.8); display: inline-block; }
        
        .dw-accuracy { font-size: 11px; color: #06b6d4; font-weight: bold; margin-top: 2px; }
        .dw-status { font-size: 10px; color: #64748b; margin-top: 6px; }
    </style>
</head>
<body>

    <iframe id="game-frame" src="https://dhaniwin.org" allowfullscreen></iframe>
    <div id="floating-bubble" onclick="togglePredictor(true)">🤖</div>

    <div id="dw-predictor-widget">
        <div class="close-btn" onclick="togglePredictor(false)">✖</div>
        <div class="dw-title">⚡ AI ROOT HACK ⚡</div>
        <div class="dw-period" id="dw-period">Target: Loading...</div>
        
        <div class="result-container">
            <div class="dw-label">Outcome</div>
            <div class="dw-pred" id="dw-prediction">...</div>
            
            <div class="dw-number-box">
                <div class="dw-label" style="font-size: 10px; color: #fbbf24;">Sure Number (9x)</div>
                <div class="dw-number" id="dw-number">-</div>
            </div>
        </div>

        <div class="dw-accuracy" id="dw-accuracy">Analyzing Core...</div>
        <div class="dw-status" id="dw-status">Connecting to Database...</div>
    </div>

    <script>
        function togglePredictor(show) {
            document.getElementById('floating-bubble').style.display = show ? 'none' : 'flex';
            document.getElementById('dw-predictor-widget').style.display = show ? 'block' : 'none';
        }

        const SUPABASE_URL = "https://ridnmxfctzfntbfpzjnd.supabase.co";
        const SUPABASE_KEY = "sb_publishable_AvI5aU3gVjj2r7PxCcfaWA_L7WOiy7m";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function fetchAndPredict() {
            if (document.getElementById('dw-predictor-widget').style.display === 'none') return;
            document.getElementById('dw-status').innerText = "Analyzing Patterns...";

            try {
                let { data: rounds, error } = await supabaseClient
                    .from('rounds')
                    .select('*')
                    .order('period', { ascending: false })
                    .limit(100);

                if (error) throw error;

                if (rounds && rounds.length > 3) {
                    const latest = rounds[0];
                    
                    let targetPeriodStr = "";
                    try { targetPeriodStr = (BigInt(latest.period) + 1n).toString(); } 
                    catch(e) { targetPeriodStr = (parseInt(latest.period) + 1).toString(); }

                    document.getElementById('dw-period').innerText = "🎯 Target Period: ..." + targetPeriodStr.slice(-4);

                    // ==========================================
                    // TERA ORIGINAL V1 LOGIC (DO NOT TOUCH)
                    // ==========================================
                    const reversedRounds = [...rounds].reverse(); // Backup for numbers
                    const history = rounds.map(r => r.outcome).reverse(); // Exact V1 string array
                    const patternLength = 3;
                    const currentPattern = history.slice(-patternLength); 
                    
                    let bigCount = 0;
                    let smallCount = 0;
                    
                    // New: Count frequency of numbers silently
                    let numberFrequency = {}; 

                    for (let i = 0; i <= history.length - patternLength - 1; i++) {
                        let isMatch = true;
                        for (let j = 0; j < patternLength; j++) {
                            if (history[i + j] !== currentPattern[j]) {
                                isMatch = false;
                                break;
                            }
                        }
                        if (isMatch) {
                            let nextResultIndex = i + patternLength;
                            let nextResult = history[nextResultIndex];
                            
                            if (nextResult === 'BIG') bigCount++;
                            if (nextResult === 'SMALL') smallCount++;
                            
                            // NAYA: Match hone par chupchap number utha lo
                            let nextNumber = reversedRounds[nextResultIndex].number;
                            if (nextNumber && nextNumber !== "?") {
                                numberFrequency[nextNumber] = (numberFrequency[nextNumber] || 0) + 1;
                            }
                        }
                    }

                    // Exact V1 Outcome Logic
                    let finalPrediction = "";
                    let accuracy = 0;
                    let totalMatches = bigCount + smallCount;

                    if (totalMatches > 0) {
                        if (bigCount > smallCount) {
                            finalPrediction = 'BIG';
                            accuracy = Math.round((bigCount / totalMatches) * 100);
                        } else if (smallCount > bigCount) {
                            finalPrediction = 'SMALL';
                            accuracy = Math.round((smallCount / totalMatches) * 100);
                        } else {
                            finalPrediction = currentPattern[2] === 'BIG' ? 'SMALL' : 'BIG';
                            accuracy = 50;
                        }
                    } else {
                        finalPrediction = currentPattern[2] === 'BIG' ? 'SMALL' : 'BIG';
                        accuracy = 55;
                    }

                    // ==========================================
                    // NAYA NUMBER LOGIC (Sirf Final Outcome ke base par)
                    // ==========================================
                    let validNumbers = (finalPrediction === 'BIG') ? ['5','6','7','8','9'] : ['0','1','2','3','4'];
                    let bestNumber = "-";
                    let highestFreq = -1;

                    // Check which number came most often in this pattern
                    for (let num of validNumbers) {
                        if (numberFrequency[num] && numberFrequency[num] > highestFreq) {
                            highestFreq = numberFrequency[num];
                            bestNumber = num;
                        }
                    }

                    // Fallback random smart pick
                    if (bestNumber === "-") {
                        bestNumber = validNumbers[Math.floor(Math.random() * validNumbers.length)];
                    }

                    // ==========================================
                    // UI UPDATES
                    // ==========================================
                    const predEl = document.getElementById('dw-prediction');
                    predEl.innerText = finalPrediction;
                    predEl.className = 'dw-pred ' + (finalPrediction === 'BIG' ? 'dw-big' : 'dw-small');
                    
                    document.getElementById('dw-number').innerText = bestNumber;
                    document.getElementById('dw-accuracy').innerText = `Match: ${accuracy}% (${totalMatches} patterns)`;
                    document.getElementById('dw-status').innerText = "Live AI ✅";
                }
            } catch (err) {
                console.error(err);
                document.getElementById('dw-status').innerText = "Error ❌";
            }
        }

        fetchAndPredict();
        setInterval(fetchAndPredict, 5000); 
    </script>
</body>
</html>
